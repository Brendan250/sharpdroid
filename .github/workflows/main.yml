name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up .NET SDK 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.103'

    - name: Set SHARPDROID_DOTNET environment variable
      run: |
        echo "SHARPDROID_DOTNET=$(dirname $(which dotnet))" >> $GITHUB_ENV

    - name: Install Toolchain / Android SDK
      run: python3 scripts/fetch-toolchain.py --install

    - name: Build Host Layer Native Library
      run: python3 scripts/build-host.py

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sharpdroid-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
