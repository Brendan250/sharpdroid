# gradle's own settings.

android.useAndroidX=true
# AGP 8 defaults this off; naming it is cheaper than rediscovering why a support-library artefact
# resolved to something ancient.
android.enableJetifier=false

org.gradle.caching=true
org.gradle.parallel=true

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# **the daemon needs TEMP pointed somewhere other than %LOCALAPPDATA%\Temp, and app\build-app.ps1
# is what does it.** it cannot be done from here: the directory is chosen by the native
# GetTempPath, so it is an environment variable rather than a JVM property, and
# -Djdk.nio.channels.unixdomain.tmpdir is ignored for the automatically assigned address the JDK
# uses here. see the comment in build-app.ps1 for what actually breaks.
